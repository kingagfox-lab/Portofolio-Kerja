<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="400" fill="#0a0a10"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- circuit grid -->
  <g stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="90" y1="0" x2="90" y2="400"/>
    <line x1="310" y1="0" x2="310" y2="400"/>
  </g>

  <!-- shoulders -->
  <path d="M60 400 C60 300 150 268 200 268 C250 268 340 300 340 400 Z" fill="url(#g2)"/>
  <path d="M60 400 C60 300 150 268 200 268 C250 268 340 300 340 400 Z" fill="none" stroke="url(#g1)" stroke-width="2"/>

  <!-- head -->
  <ellipse cx="200" cy="168" rx="72" ry="82" fill="#0d0d14" stroke="url(#g1)" stroke-width="2.5"/>

  <!-- faceted highlight lines (low-poly developer avatar feel) -->
  <g stroke="url(#g1)" stroke-width="1.4" fill="none" stroke-opacity="0.85">
    <path d="M140 150 L200 120 L260 150"/>
    <path d="M150 195 L200 165 L250 195"/>
    <path d="M200 120 L200 250"/>
    <path d="M140 150 L150 195"/>
    <path d="M260 150 L250 195"/>
  </g>

  <!-- glasses / eyes suggestion -->
  <circle cx="172" cy="168" r="9" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <circle cx="228" cy="168" r="9" fill="none" stroke="#60A5FA" stroke-width="2.5"/>
  <line x1="181" y1="168" x2="219" y2="168" stroke="#60A5FA" stroke-width="2.5"/>

  <!-- code brackets floating -->
  <text x="46" y="60" font-family="JetBrains Mono, monospace" font-size="26" fill="#8B5CF6" opacity="0.65">&lt;/&gt;</text>
  <text x="300" y="380" font-family="JetBrains Mono, monospace" font-size="20" fill="#3B82F6" opacity="0.55">{ }</text>

  <!-- particles -->
  <circle cx="60" cy="120" r="3" fill="#A78BFA"/>
  <circle cx="340" cy="90" r="2.5" fill="#60A5FA"/>
  <circle cx="80" cy="340" r="2" fill="#60A5FA"/>
  <circle cx="330" cy="250" r="3" fill="#A78BFA"/>
</svg>
